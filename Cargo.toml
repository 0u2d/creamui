[workspace]
resolver = "2"
members = [
    "crates/reactive",
    "crates/core",
    "crates/theme",
    "crates/themes",
    "crates/widgets",
    "crates/image",
    "crates/render",
    "crates/abi",
    "crates/ffi",
    "crates/jsx",
    "crates/macros",
    "crates/dynamic",
    "examples/hello-world",
    "examples/calculator",
    "examples/text-editor",
    "examples/tabs",
    "examples/sidebar",
    "examples/scroll",
    "examples/showcase",
    "examples/pickers",
    "examples/images",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creamui-rs/creamui"

[workspace.dependencies]
creamui-reactive = { path = "crates/reactive" }
creamui-core = { path = "crates/core" }
creamui-theme = { path = "crates/theme" }
creamui-themes = { path = "crates/themes" }
creamui-widgets = { path = "crates/widgets" }
creamui-render = { path = "crates/render" }
creamui-jsx = { path = "crates/jsx" }
creamui-macros = { path = "crates/macros" }
creamui-abi = { path = "crates/abi" }
creamui-ffi = { path = "crates/ffi" }
creamui-dynamic = { path = "crates/dynamic" }

taffy = "0.7"
wgpu = "22"
winit = "0.30"
tiny-skia = "0.11"
raw-window-handle = "0.6"
pollster = "0.3"
softbuffer = "0.4"
libloading = "0.8"
arboard = "3"
rfd = "0.17"

# Optimize third-party deps (tiny-skia, fontdue, taffy) even in dev builds;
# `*` excludes workspace crates so edit-compile-run stays fast.
[profile.dev.package."*"]
opt-level = 2
