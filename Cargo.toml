[workspace]
resolver = "2"
members = [
    "crates/reactive",
    "crates/core",
    "crates/theme",
    "crates/widgets",
    "crates/render",
    "crates/ffi",
    "crates/jsx",
    "crates/macros",
    "examples/hello_world",
    "examples/hello_world_dynamic",
    "examples/jsx_hello_world",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/creamui-rs/creamui"

[workspace.dependencies]
creamui-reactive = { path = "crates/reactive" }
creamui-core = { path = "crates/core" }
creamui-theme = { path = "crates/theme" }
creamui-widgets = { path = "crates/widgets" }
creamui-render = { path = "crates/render" }
creamui-jsx = { path = "crates/jsx" }
creamui-macros = { path = "crates/macros" }

taffy = "0.7"
wgpu = "22"
winit = "0.30"
tiny-skia = "0.11"
raw-window-handle = "0.6"
pollster = "0.3"
