[workspace]
resolver = "2"
members = [
    "crates/creamui",
    "crates/reactive",
    "crates/core",
    "crates/theme",
    "crates/widgets",
    "crates/image",
    "crates/render",
    "crates/abi",
    "crates/ffi",
    "crates/jsx",
    "crates/macros",
    "crates/dynamic",
    "examples/hello-world",
    "examples/calculator",
    "examples/text-editor",
    "examples/tabs",
    "examples/sidebar",
    "examples/scroll",
    "examples/showcase",
    "examples/pickers",
    "examples/images",
    "examples/facade",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sammwy"]
repository = "https://github.com/sammwyy/creamui"
homepage = "https://github.com/sammwyy/creamui"

[workspace.dependencies]
creamui-reactive = { version = "0.1.0", path = "crates/reactive" }
creamui = { version = "0.1.0", path = "crates/creamui" }
creamui-core = { version = "0.1.0", path = "crates/core" }
creamui-theme = { version = "0.1.0", path = "crates/theme" }
creamui-widgets = { version = "0.1.0", path = "crates/widgets" }
creamui-image = { version = "0.1.0", path = "crates/image" }
creamui-render = { version = "0.1.0", path = "crates/render" }
creamui-jsx = { version = "0.1.0", path = "crates/jsx" }
creamui-macros = { version = "0.1.0", path = "crates/macros" }
creamui-abi = { version = "0.1.0", path = "crates/abi" }
creamui-ffi = { version = "0.1.0", path = "crates/ffi" }
creamui-dynamic = { version = "0.1.0", path = "crates/dynamic" }

taffy = "0.7"
wgpu = "22"
winit = "0.30"
tiny-skia = "0.11"
raw-window-handle = "0.6"
pollster = "0.3"
softbuffer = "0.4"
libloading = "0.8"
arboard = "3"
rfd = "0.17"

# Optimize third-party deps (tiny-skia, fontdue, taffy) even in dev builds;
# `*` excludes workspace crates so edit-compile-run stays fast.
[profile.dev.package."*"]
opt-level = 2
