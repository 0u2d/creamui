[package]
name = "creamui-render"
description = "wgpu + winit windowing and rendering backend for CreamUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "winit", "wgpu"]
categories = ["gui"]

[dependencies]
creamui-core = { workspace = true }
creamui-theme = { workspace = true }
creamui-reactive = { workspace = true }
winit = { workspace = true }
tiny-skia = { workspace = true }
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
softbuffer = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
web-time = "1"
